# Dependabot (frostyard/core ADR-0071 row B13). nsl has 2 ecosystems with a
# manifest: Go modules in go.mod and the actions the workflows pin.
# site/requirements.txt needs no entry (it is installed with --require-hashes
# from a pinned file), and there is no Dockerfile or package.json.
# Each entry has 1 group with `patterns: ["*"]`, so it opens at most 1
# version-update PR for each run (frostyard/core ADR-0075). Each entry's
# schedule is only `interval: monthly`, so GitHub runs it on the 1st of the
# month at a time it picks, and each ecosystem has 1 entry (frostyard/core
# ADR-0089). Security updates are not on the schedule: they stay ungrouped
# and immediate.
version: 2
updates:
  # The Go modules of go.mod.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      gomod:
        patterns: ["*"]

  # The actions the workflows pin.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions:
        patterns: ["*"]
