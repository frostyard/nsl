name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make ci
  release-config:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      HAS_GORELEASER_KEY: ${{ secrets.GORELEASER_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        if: env.HAS_GORELEASER_KEY == 'true'
        with:
          distribution: goreleaser-pro
          version: '~> v2'
          args: check
        env:
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
      - name: Require release validation on trusted runs
        if: env.HAS_GORELEASER_KEY != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: exit 1
      - name: Explain fork PR validation gap
        if: env.HAS_GORELEASER_KEY != 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: echo 'GoReleaser Pro check deferred to trusted main/merge-group run.'
