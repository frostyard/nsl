# CI workflow. The verify job runs `make ci`, every prerequisite of it in 1 job
# (core ADR-0073 allows 1 job). Actions use full commit SHA pins, the token has
# no permissions by default, and checkouts do not persist credentials (core
# ADR-0021).
name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # mise.toml and mise.lock pin every tool the gates run beyond Go (frostyard/core
      # ADR-0043): this installs the locked golangci-lint and Node that make ci
      # runs, checksum-verified. Go still comes from setup-go (go.mod).
      - name: Install pinned tools
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install: true
          install_args: golangci-lint node
          cache: true
      # make ci also runs corrections-base, which compares .memory/corrections.jsonl
      # with BASE. On a push or merge-group event BASE is empty, so the
      # corrections comparison is skipped there.
      - name: Run make ci
        run: make ci
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
  vulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The govulncheck version is pinned, and the Go checksum database verifies the module.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
  release-config:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      HAS_GORELEASER_KEY: ${{ secrets.GORELEASER_KEY != '' }}
    steps:
      # A pull request from a fork gets no repository secrets, and a Dependabot
      # run gets only Dependabot secrets, so those runs cannot read
      # GORELEASER_KEY and cannot validate the release configuration. The
      # merge-group and main runs do validate it, and any other run without the
      # key fails, so a lost secret is never silent.
      - name: Decide on release validation
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ "$HAS_GORELEASER_KEY" = "true" ]; then
            echo "GORELEASER_KEY is available: the GoReleaser Pro check and the cask check run."
            exit 0
          fi
          reason=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ "$HEAD_REPOSITORY" != "$REPOSITORY" ]; then
              reason="a pull request from a fork gets no repository secrets"
            elif [ "$ACTOR" = "dependabot[bot]" ]; then
              reason="a Dependabot run gets only Dependabot secrets"
            fi
          fi
          if [ -n "$reason" ]; then
            msg="Release validation skipped: GORELEASER_KEY is absent because $reason. The merge-group and main runs check the release configuration."
            echo "::notice title=Release validation skipped::$msg"
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              printf '%s\n' "$msg" >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi
          echo "::error title=Release validation missing::GORELEASER_KEY is absent on a $EVENT_NAME run, which must validate the release configuration."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: env.HAS_GORELEASER_KEY == 'true'
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        if: env.HAS_GORELEASER_KEY == 'true'
        with:
          distribution: goreleaser-pro
          version: v2.20.0
          args: check
        env:
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
      - name: Render the Homebrew cask
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        if: env.HAS_GORELEASER_KEY == 'true'
        with:
          distribution: goreleaser-pro
          version: v2.20.0
          args: release --snapshot --clean
        env:
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
      - name: Check the Homebrew cask
        if: env.HAS_GORELEASER_KEY == 'true'
        run: python3 scripts/check-cask.py dist/homebrew/Casks/nsl.rb
