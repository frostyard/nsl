# CI workflow. The verify job runs `make ci`, every prerequisite of it in 1 job
# (core ADR-0073 allows 1 job). Actions use full commit SHA pins, the token has
# no permissions by default, and checkouts do not persist credentials (core
# ADR-0021).
name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # mise.toml and mise.lock pin every tool the gates run beyond Go (frostyard/core
      # ADR-0043): this installs the locked golangci-lint and Node that make ci
      # runs, checksum-verified. Go still comes from setup-go (go.mod).
      - name: Install pinned tools
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install: true
          install_args: golangci-lint node
          cache: true
      # make ci also runs corrections-base, which compares .memory/corrections.jsonl
      # with BASE. On a push or merge-group event BASE is empty, so the
      # corrections comparison is skipped there.
      - name: Run make ci
        run: make ci
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
  vulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The govulncheck version is pinned, and the Go checksum database verifies the module.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
  release-config:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      HAS_GORELEASER_KEY: ${{ secrets.GORELEASER_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: env.HAS_GORELEASER_KEY == 'true'
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        if: env.HAS_GORELEASER_KEY == 'true'
        with:
          distribution: goreleaser-pro
          version: v2.20.0
          args: check
        env:
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
      - name: Render the Homebrew cask
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        if: env.HAS_GORELEASER_KEY == 'true'
        with:
          distribution: goreleaser-pro
          version: v2.20.0
          args: release --snapshot --clean
        env:
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
      - name: Check the Homebrew cask
        if: env.HAS_GORELEASER_KEY == 'true'
        run: python3 scripts/check-cask.py dist/homebrew/Casks/nsl.rb
      - name: Require release validation on trusted runs
        if: env.HAS_GORELEASER_KEY != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: exit 1
      - name: Explain fork PR validation gap
        if: env.HAS_GORELEASER_KEY != 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: echo 'GoReleaser Pro check deferred to trusted main/merge-group run.'
