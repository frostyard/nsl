name: Images
on:
  # Weekly rebuilds pick up distro security updates well inside the catalogue's 30-day expiry.
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
    inputs:
      operation:
        description: Build/publish the matrix, refresh its catalogue, or withdraw images
        type: choice
        options: [publish, refresh, withdraw]
        default: publish
      revoke:
        description: Manifest SHA256 digests to withdraw (space or comma separated)
        type: string
        default: ""
permissions: {}
concurrency:
  group: image-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'frostyard/nsl' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, nsl-image-builder]
    timeout-minutes: 180
    env:
      GOROOT: "" # Use the toolchain selected by setup-go, not the runner login environment.
      GOBIN: ""
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Prepare pinned local tools
        env:
          OPERATION: ${{ inputs.operation || 'publish' }}
        run: |
          if [ "$OPERATION" = publish ]; then scripts/bootstrap-poc.sh --waypipe; fi
          python3 scripts/bootstrap-publisher.py
          echo "NSL_LIMACTL=$GITHUB_WORKSPACE/build/poc/tools/bin/limactl" >> "$GITHUB_ENV"
          echo "NSL_WAYPIPE=$GITHUB_WORKSPACE/build/poc/tools/usr/bin/waypipe" >> "$GITHUB_ENV"
          # A builder of its own: a builder's mount belongs to the checkout that created it.
          echo "NSL_IMAGE_LIMA_HOME=$HOME/.local/share/nsl-publication-build" >> "$GITHUB_ENV"
      # The runner's session supplies KVM, vsock and a Wayland compositor (WAYLAND_DISPLAY) for the gui checks.
      - name: Build and accept the VM image and every machine image
        if: (inputs.operation || 'publish') == 'publish'
        run: python3 scripts/publish-images.py build
      - name: Sign, publish and promote the complete catalogue
        env:
          GHCR_TOKEN: ${{ github.token }}
          OPERATION: ${{ inputs.operation || 'publish' }}
          REVOKE_DIGESTS: ${{ inputs.revoke }}
        run: python3 scripts/publish-images.py "$OPERATION"
