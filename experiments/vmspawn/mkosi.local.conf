# nsl experiment overlay; upstream recipe remains in its own checkout.
[Build]
ToolsTree=no
Incremental=no

[Output]
Output=nsl-debian-vm-v3
ImageId=nsl-debian-vm

[Content]
RootPassword=hashed:!
Ssh=never
Packages=openssh-server
         ca-certificates
         systemd-boot-efi
         python3
         sudo
         dbus-user-session
         libpam-systemd
         waypipe
         galculator
         curl
ExtraTrees=overlay
PostInstallationScripts=nsl-postinst.chroot
