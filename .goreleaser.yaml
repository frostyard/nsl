version: 2
pro: true
project_name: nsl
metadata:
  description: NSpawn Subsystem for Linux — development machines on atomic hosts
  homepage: https://github.com/frostyard/nsl
  license: MIT
builds:
  - id: nsl
    binary: nsl
    main: .
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
archives:
  - formats:
      - tar.gz
    files:
      - README.md
      - LICENSE
      - THIRD_PARTY_NOTICES.txt
checksum:
  name_template: checksums.txt
homebrew_casks:
  - name: nsl
    binaries:
      - nsl
    directory: Casks
    skip_upload: auto
    repository:
      owner: frostyard
      name: homebrew-tap
      token: "{{ .Env.ORG_PAT }}"
    caveats: |
      nsl requires an x86-64 Linux host with KVM, systemd-vmspawn, QEMU,
      UEFI firmware, virtiofsd and membership in the kvm group.
      Run nsl doctor to check host prerequisites; install them with your host's tools.
      Installation guide: https://frostyard.github.io/nsl/getting-started/install/
changelog:
  sort: asc
  filters:
    exclude:
      - '^test:'
      - '^chore:'
