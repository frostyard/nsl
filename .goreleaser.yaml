version: 2
pro: true
project_name: nsl
metadata:
  description: NSpawn Subsystem for Linux — development machines on atomic hosts
  homepage: https://github.com/frostyard/nsl
  license: MIT
builds:
  - id: nsl
    binary: nsl
    main: .
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
archives:
  # No version in the name, so releases/latest/download/ URLs in the install
  # guide always reach the newest release (ADR-0020).
  - name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    files:
      - README.md
      - LICENSE
      - THIRD_PARTY_NOTICES.txt
checksum:
  name_template: checksums.txt
homebrew_casks:
  - name: nsl
    binaries:
      - nsl
    directory: Casks
    skip_upload: auto
    commit_msg_template: "fix(cask): bump nsl to {{ .Tag }}"
    # The tap's main branch accepts changes only through a reviewed pull
    # request, so each stable release pushes a branch of its own and opens a
    # pull request into main (ADR-0020).
    repository:
      owner: frostyard
      name: homebrew-tap
      branch: "bump/nsl-{{ .Version }}"
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
      pull_request:
        enabled: true
        base:
          owner: frostyard
          name: homebrew-tap
          branch: main
        body: |
          Updates `Casks/nsl.rb` to the nsl release in the title.

          The release workflow of [frostyard/nsl](https://github.com/frostyard/nsl/releases)
          generated this cask with GoReleaser from the release's own archives
          ([ADR-0020](https://github.com/frostyard/nsl/blob/main/docs/adr/0020-homebrew-tap-publication.md)).
          Change nsl's release configuration instead of this file: the next
          release overwrites it.

          Risk path: `Casks/**` matches `Casks/nsl.rb`. The change is safe to
          merge when the URLs name the release's tag and each sha256 equals the
          archive's line in that release's `checksums.txt`.
    caveats: |
      nsl requires an x86-64 Linux host with KVM, systemd-vmspawn, QEMU,
      UEFI firmware, virtiofsd and membership in the kvm group.
      Run nsl doctor to check host prerequisites; install them with your host's tools.
      Installation guide: https://frostyard.github.io/nsl/getting-started/install/
changelog:
  sort: asc
  filters:
    exclude:
      - '^test:'
      - '^chore:'
