# yaml-language-server: $schema=https://jaywhj.github.io/mkdocs-materialx/schema.json
# The nsl documentation site: ProperDocs with the MaterialX theme, under
# docs/adr/0018-user-documentation-site.md. `make site` builds it into
# site/dist; `make site-serve` previews it at http://127.0.0.1:8000/nsl/.

site_name: nsl
site_url: https://frostyard.github.io/nsl/
site_description: WSL-style Linux machines on a Linux host.
site_author: Frostyard
copyright: nsl is MIT licensed. Part of <a href="https://frostyard.org">Frostyard</a>.

repo_name: frostyard/nsl
repo_url: https://github.com/frostyard/nsl
edit_uri: edit/main/site/content/

docs_dir: content
site_dir: dist

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Get started:
      - Install: getting-started/install.md
      - Your first machine: getting-started/first-machine.md
  - Guides:
      - Machines: guides/machines.md
      - Host files: guides/host-files.md
      - Ports: guides/ports.md
      - Desktop applications: guides/desktop.md
      - Editors over SSH: guides/editors.md
      - Isolated machines: guides/isolated.md
      - Export and import: guides/export-import.md
      - Images and updates: guides/images.md
      - Storage and recovery: guides/storage.md
  - Concepts:
      - How nsl works: concepts/how-it-works.md
      - Trust model: concepts/trust.md
  - Reference:
      - Commands: reference/cli.md
      - Configuration: reference/configuration.md
      - Machine images: reference/machine-images.md
      - Limits and troubleshooting: reference/limits.md
  - Contributing:
      - Build from source: contributing/build.md

theme:
  name: materialx
  logo: assets/nsl.svg
  favicon: assets/nsl.svg
  language: en
  font: false
  # Frostyard surfaces are solid; no frosted-glass header.
  topbar_style: primary
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - content.action.edit
    - content.code.copy
    - navigation.footer
    - navigation.sections
    - navigation.tabs
    - search.highlight
    - search.share
    - toc.follow

plugins:
  - search

extra_css:
  - stylesheets/frostyard.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/frostyard/nsl
      name: nsl on GitHub

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
