# The host's key runs the nsl agent as root; nothing else logs in.
PermitRootLogin forced-commands-only
AllowUsers root
AuthorizedKeysFile /run/nsl/ssh/authorized_keys
HostKey /var/lib/nsl/ssh/ssh_host_ed25519_key
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitUserEnvironment no
AllowAgentForwarding no
X11Forwarding no
PermitTunnel no
# Port forwarding reaches VM loopback; Waypipe forwards Unix sockets back. sshd
# denies remote Unix-socket forwards unless TCP forwarding allows remote too.
AllowTcpForwarding yes
AllowStreamLocalForwarding remote
StreamLocalBindUnlink yes
