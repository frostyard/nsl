[Build]
ToolsTree=no
Incremental=no

[Content]
RootPassword=hashed:!
Ssh=never
ExtraTrees=overlay
PostInstallationScripts=nsl-postinst.chroot
FinalizeScripts=nsl-finalize.chroot
# The Debian recipe installs these for login sessions in machines. With pam_systemd
# in the VM, every agent call over SSH would open a logind session and a user manager.
RemovePackages=dbus-user-session
               libpam-systemd
Packages=openssh-server
         ca-certificates
         dbus
         systemd-repart
         systemd-boot-efi
         systemd-ukify
         systemd-container
         btrfs-progs
         zstd
         waypipe
