[Distribution]
# Azure Linux 4.0 publishes only a beta channel, under beta/ rather than the prod/
# that mkosi's repositories assume. The build reads the base repository directly;
# the image's own repository files come from azurelinux-repos.
LocalMirror=https://packages.microsoft.com/azurelinux/4.0/beta/base/x86_64/

[Content]
# The recipes carry no Azure Linux recipe, so the profile names what Fedora's adds.
# azurelinux-repos-dev also provides azurelinux-repos(4.0) and points dnf at an
# unsigned development feed; naming azurelinux-repos keeps the signed one.
Packages=azurelinux-repos
         dbus-broker
         dnf5
         glibc-langpack-en
         iproute
         iputils
         pam
         util-linux
         vim-minimal
PostInstallationScripts=nsl-azure-postinst.chroot
