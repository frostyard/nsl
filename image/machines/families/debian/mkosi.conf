[Build]
# The builder is Debian; its own tools build Debian images.
ToolsTree=no

[Content]
# systemd 262 only recommends mount, and mkosi installs no recommends; mount
# units, the nesting procfs among them, need it.
Packages=mount
         libpam-systemd
         dbus-user-session
         sudo
         passwd
         tzdata
         ca-certificates
         openssh-server
         fonts-dejavu-core
         adwaita-icon-theme
         libwayland-client0
         libwayland-cursor0
