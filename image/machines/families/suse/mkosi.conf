[Build]
# Native zypper avoids the foreign tools tree's single-transaction pipe deadlock.
ToolsTree=default
ToolsTreeDistribution=opensuse
ToolsTreeRelease=tumbleweed

[Content]
Packages=glibc-locale-base
         sudo
         ca-certificates-mozilla
         openssh-server
         dejavu-fonts
         adwaita-icon-theme
         libwayland-client0
         libwayland-cursor0
