[Build]
# Fedora's tools tree carries pacman and the Arch signing keyring.
ToolsTree=default
ToolsTreeDistribution=fedora
ToolsTreeRelease=44

[Content]
Packages=sudo
         shadow
         tzdata
         ca-certificates
         openssh
         ttf-dejavu
         adwaita-cursors
         wayland
FinalizeScripts=nsl-arch-finalize.chroot
