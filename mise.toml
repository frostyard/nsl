# Tool pins for this repository (frostyard/core ADR-0043). Keep the Go pin
# aligned with go.mod, which setup-go reads in CI. mise.lock carries each
# tool's checksums: `mise install`
# provisions exactly these, and `mise outdated` reports newer releases.
[settings]
lockfile = true

[tools]
# Explicit selection avoids mise's deprecated use of go.mod's minimum version.
go = "1.25.8"
# make lint, and so make verify and make ci; the Makefile checks this release.
golangci-lint = "2.13.1"
# make bump: the next version from conventional commits, per .svu.yml.
svu = "3.4.1"
